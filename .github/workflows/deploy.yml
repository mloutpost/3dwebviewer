name: Deploy to Firebase (viewer + functions)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 3dwebviewer
        uses: actions/checkout@v4
        with:
          path: 3dwebviewer

      - name: Checkout lctf_clients
        uses: actions/checkout@v4
        with:
          repository: mloutpost/lctf_clients
          path: lctf_clients
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lctf_clients/functions/package-lock.json

      - name: Install function dependencies
        run: npm ci
        working-directory: lctf_clients/functions

      - name: Build functions
        run: npm run build
        working-directory: lctf_clients/functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate with Google Cloud
        run: |
          echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}' > ${{ runner.temp }}/gcloud.json

      - name: Deploy
        run: firebase deploy --only hosting:viewer,functions
        working-directory: lctf_clients
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcloud.json
