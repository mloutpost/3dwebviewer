<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquire About a Kit | Shop Timber Frame Kits</title>
    <meta name="description" content="Get in touch about timber frame kits. We'll help you find the right design, answer questions, and provide a detailed quote.">
    <link rel="icon" type="image/png" href="assets/global_graphics/LCTF Profile.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --accent: #4a7c59;
            --accent-hover: #5a9c69;
            --bg: #faf9f6;
            --bg-secondary: #f0ede8;
            --text: #2d2a26;
            --text-muted: #6b6560;
            --border: rgba(45, 42, 38, 0.12);
            --border-focus: rgba(74, 124, 89, 0.4);
            --shadow: 0 2px 16px rgba(45, 42, 38, 0.06);
            --error: #c53030;
            --error-bg: #fff5f5;
            --success: #2f855a;
            --success-bg: #f0fff4;
            --radius: 10px;
            --transition: all 0.25s ease;
        }
        [data-theme="dark"] {
            --bg: #2d2a26;
            --bg-secondary: #3a3632;
            --text: #f5f3ef;
            --text-muted: #b8b4ae;
            --border: rgba(245, 243, 239, 0.15);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        body {
            font-family: 'Helvetica Neue', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }
        .container { max-width: 520px; margin: 0 auto; padding: 1.5rem; }
        .header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 0; margin-bottom: 1.5rem; }
        .back-link {
            display: flex; align-items: center; gap: 0.5rem;
            color: var(--text-muted); text-decoration: none; font-size: 0.875rem; font-weight: 500;
            transition: var(--transition);
        }
        .back-link:hover { color: var(--accent); }
        .back-link svg { width: 20px; height: 20px; }
        .logo { height: 48px; width: auto; }
        .hero { text-align: center; margin-bottom: 2rem; }
        .hero h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
        .hero-subtitle { color: var(--text-muted); font-size: 0.95rem; }
        .form-section { background: var(--bg-secondary); border-radius: var(--radius); padding: 1.75rem; margin-bottom: 1.5rem; border: 1px solid var(--border); }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-muted); }
        .form-group input, .form-group textarea {
            width: 100%; padding: 0.75rem 1rem;
            border: 1px solid var(--border); border-radius: var(--radius);
            background: var(--bg); color: var(--text);
            font-family: inherit; font-size: 1rem;
            transition: var(--transition);
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--border-focus);
        }
        .form-group input.error { border-color: var(--error); }
        .form-group textarea { resize: vertical; min-height: 100px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }
        .field-error { font-size: 0.75rem; color: var(--error); margin-top: 0.25rem; display: none; }
        .field-error.visible { display: block; }
        .submit-btn {
            width: 100%; padding: 1rem 1.5rem;
            background: var(--accent); color: white; border: none; border-radius: var(--radius);
            font-size: 1rem; font-weight: 600; cursor: pointer;
            transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .submit-btn:hover:not(:disabled) { background: var(--accent-hover); }
        .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .form-message { text-align: center; padding: 0.75rem; border-radius: var(--radius); margin-bottom: 1rem; font-size: 0.9rem; display: none; }
        .form-message.visible, .form-message.error { display: block; }
        .form-message.error { background: var(--error-bg); color: var(--error); }
        .success-view { display: none; text-align: center; padding: 2rem 1rem; }
        .success-view.visible { display: block; }
        .success-icon { width: 64px; height: 64px; background: var(--success-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
        .success-icon svg { width: 32px; height: 32px; color: var(--success); }
        .success-view h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .success-view p { color: var(--text-muted); margin-bottom: 1.5rem; }
        .success-view .back-home {
            display: inline-block; padding: 0.75rem 1.5rem; background: var(--accent); color: white;
            text-decoration: none; border-radius: var(--radius); font-weight: 500; transition: var(--transition);
        }
        .success-view .back-home:hover { background: var(--accent-hover); }
        .form-content.hidden { display: none; }
        .footer { text-align: center; padding: 2rem 0; color: var(--text-muted); font-size: 0.75rem; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="index.html" class="back-link">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
                Back
            </a>
            <img src="assets/global_graphics/LCTF Profile.png" alt="Shop Timber Frame Kits" class="logo">
        </header>
        <section class="hero">
            <h1>Inquire About a Kit</h1>
            <p class="hero-subtitle">Tell us about your project and we'll get back to you within 1 business day.</p>
        </section>
        <div class="form-section">
            <div id="formContent" class="form-content">
                <p id="formMessage" class="form-message"></p>
                <form id="leadForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" name="firstName" required placeholder="Jane">
                            <span id="firstNameError" class="field-error">Required</span>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" name="lastName" required placeholder="Smith">
                            <span id="lastNameError" class="field-error">Required</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required placeholder="jane@example.com">
                        <span id="emailError" class="field-error">Valid email required</span>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone *</label>
                        <input type="tel" id="phone" name="phone" required placeholder="(555) 123-4567">
                        <span id="phoneError" class="field-error">Required</span>
                    </div>
                    <div class="form-group">
                        <label for="location">Location / Build Site *</label>
                        <input type="text" id="location" name="location" required placeholder="City, State">
                        <span id="locationError" class="field-error">Required</span>
                    </div>
                    <div class="form-group">
                        <label for="projectType">Interested In</label>
                        <select id="projectType" name="projectType">
                            <option value="">Select a kit type...</option>
                            <option value="Pavilion">Pavilion</option>
                            <option value="Pergola">Pergola</option>
                            <option value="Entryway">Entryway</option>
                            <option value="Barn">Barn</option>
                            <option value="Custom Design">Custom Design ($500)</option>
                            <option value="Builder Rebate Program">Builder Rebate Program</option>
                            <option value="Builder Referral">Builder Referral</option>
                            <option value="Project Gallery Submission">Project Gallery Submission</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="notes">Project Details</label>
                        <textarea id="notes" name="notes" placeholder="Tell us about your project, timeline, or any questions..."></textarea>
                    </div>
                    <button type="submit" id="submitBtn" class="submit-btn">
                        <span id="btnText">Send Inquiry</span>
                        <span id="spinner" class="spinner" style="display:none"></span>
                    </button>
                </form>
            </div>
            <div id="successView" class="success-view">
                <div class="success-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg></div>
                <h2>Thanks for reaching out!</h2>
                <p>We'll be in touch within 1 business day to discuss your project.</p>
                <a href="index.html" class="back-home">Back to Catalog</a>
            </div>
        </div>
        <footer class="footer">
            <p>Shop Timber Frame Kits</p>
        </footer>
    </div>
    <script>
        const API_URL = 'https://us-central1-lctf-projects.cloudfunctions.net/createLead';
        const API_KEY = '66c25ffa0e50f06e993f9dba1bcfc5007314eb2200da2b77d288e0141064f002';
        const form = document.getElementById('leadForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');
        const formMessage = document.getElementById('formMessage');
        const formContent = document.getElementById('formContent');
        const successView = document.getElementById('successView');

        document.getElementById('phone').addEventListener('input', (e) => {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length > 0) {
                if (v.length <= 3) v = `(${v}`;
                else if (v.length <= 6) v = `(${v.slice(0,3)}) ${v.slice(3)}`;
                else v = `(${v.slice(0,3)}) ${v.slice(3,6)}-${v.slice(6,10)}`;
            }
            e.target.value = v;
        });

        function validateField(field) {
            const err = document.getElementById(field.id + 'Error');
            let ok = true;
            if (field.required && !field.value.trim()) ok = false;
            if (field.type === 'email' && field.value && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(field.value)) ok = false;
            field.classList.toggle('error', !ok);
            if (err) err.classList.toggle('visible', !ok);
            return ok;
        }
        document.querySelectorAll('input[required]').forEach(i => i.addEventListener('blur', () => validateField(i)));

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fn = document.getElementById('firstName'), ln = document.getElementById('lastName');
            const em = document.getElementById('email'), ph = document.getElementById('phone');
            const loc = document.getElementById('location'), pt = document.getElementById('projectType');
            const notes = document.getElementById('notes');

            if (!validateField(fn) || !validateField(ln) || !validateField(em) || !validateField(ph) || !validateField(loc)) {
                formMessage.textContent = 'Please fill in all required fields correctly.';
                formMessage.className = 'form-message error visible';
                return;
            }
            formMessage.className = 'form-message';
            submitBtn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';

            const payload = {
                firstName: fn.value.trim(), lastName: ln.value.trim(), email: em.value.trim(),
                phone: ph.value.trim(), location: loc.value.trim(),
                source: 'web-form', projectType: pt.value || 'General Inquiry',
                notes: notes.value.trim() || 'General inquiry from website'
            };
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error('Network error');
                formContent.classList.add('hidden');
                successView.classList.add('visible');
            } catch (err) {
                formMessage.textContent = 'Something went wrong. Please try again or contact us directly.';
                formMessage.className = 'form-message error visible';
                submitBtn.disabled = false;
                btnText.style.display = 'inline';
                spinner.style.display = 'none';
            }
        });
        var params = new URLSearchParams(location.search);
        var pt = params.get('projectType');
        if (pt) { var sel = document.getElementById('projectType'); if (sel) sel.value = pt; }
        document.getElementById('firstName').focus();
    </script>
</body>
</html>
